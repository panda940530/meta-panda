require conf/distro/poky.conf
DISTRO = "panda"
DISTRO_NAME = "Panda"
DISTRO_VERSION = "1.0"
MAINTAINER = "Panda Team <146832041+panda940530@users.noreply.github.com>"

CMDLINE_ROOT_PARTITION:rpi = "/dev/sda2"

WKS_FILE:rpi = "panda-usb.wks"

ENABLE_DWC2_HOST:rpi = "1"

ENABLE_UART:rpi = "1"
# 不使用 rpidistro 的 WiFi 與藍牙韌體，避免 Synaptics/Cypress 授權風險
MACHINE_EXTRA_RRECOMMENDS:remove = "linux-firmware-rpidistro-bcm43455 linux-firmware-rpidistro-bcm43456 bluez-firmware-rpidistro-bcm4345c0-hcd bluez-firmware-rpidistro-bcm4345c5-hcd"
# 不要幫每個套件多編一份自我測試程式（省建置時間與磁碟）
# 本機走乙太網路，無線韌體已因授權風險移除；留著堆疊只是死重量與攻擊面
DISTRO_FEATURES_OPTED_OUT:append = " ptest bluetooth wifi"
#統磁碟多留 256 MB 空白
IMAGE_ROOTFS_EXTRA_SPACE = "262144"
# Kuber-1000 的 RTC 掛在 i2c1，但腳位被載板改到 GPIO44/45（不是預設的 GPIO2/3）
KERNEL_DEVICETREE:append:rpi = " overlays/i2c1.dtbo"
RPI_EXTRA_CONFIG:append:rpi = "\ndtoverlay=i2c1,pins_44_45"
