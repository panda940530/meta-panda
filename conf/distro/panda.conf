require conf/distro/poky.conf
DISTRO = "panda"
DISTRO_NAME = "Panda"
DISTRO_VERSION = "1.0"
MAINTAINER = "Panda Team <146832041+panda940530@users.noreply.github.com>"

CMDLINE_ROOT_PARTITION:rpi = "/dev/sda2"

WKS_FILE:rpi = "panda-usb.wks"

ENABLE_DWC2_HOST:rpi = "1"

ENABLE_UART:rpi = "1"

# 不使用 rpidistro WiFi 韌體，避免 Synaptics killswitch 授權風險
# 詳見 meta-raspberrypi/docs/ipcompliance.md，本機走乙太網路
MACHINE_EXTRA_RRECOMMENDS:remove = "linux-firmware-rpidistro-bcm43455 linux-firmware-rpidistro-bcm43456"
#不要幫每個套件多編一份自我測試程式
DISTRO_FEATURES_OPTED_OUT:append = " ptest"
#系統磁碟多留 256 MB 空白
IMAGE_ROOTFS_EXTRA_SPACE = "262144"